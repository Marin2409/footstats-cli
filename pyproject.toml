[project]
name = "footstats-scraper"
version = "0.1.0"
description = "Football Stats Scraper - Footstats CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "annotated-doc>=0.0.4",
    "beautifulsoup4>=4.14.3",
    "chromium>=0.0.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "playwright>=1.60.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "readchar>=4.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "shellingham>=1.5.4",
    "typer>=0.26.4",
]

[project.scripts]
footstats = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
